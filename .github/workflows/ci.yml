name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (go ${{ matrix.go }}, ${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ['1.24', '1.25']
        module: ['.', 'temporal']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - name: go vet
        working-directory: ${{ matrix.module }}
        run: go vet ./...
      - name: go test -race
        working-directory: ${{ matrix.module }}
        run: go test -race ./...

  zero-deps:
    name: engine has zero external dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: assert no non-stdlib imports in the root module
        run: |
          leaks=$(go list -deps ./... | grep -v '^github.com/arisros/fate' | grep '\.' | grep -v '^golang.org/x/' || true)
          if [ -n "$leaks" ]; then
            echo "root module pulled in non-stdlib dependencies:"; echo "$leaks"; exit 1
          fi
          echo "ok: engine is standard-library only"

  coverage:
    name: coverage gate (>=85%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: test with coverage (library packages only)
        run: go test -coverprofile=cover.out $(go list ./... | grep -v '/examples/')
      - name: enforce threshold
        run: |
          total=$(go tool cover -func=cover.out | awk '/^total:/ {print substr($3, 1, length($3)-1)}')
          echo "total coverage: ${total}%"
          awk "BEGIN { exit !(${total} >= 85) }" || { echo "coverage ${total}% is below the 85% gate"; exit 1; }

  lint:
    name: golangci-lint (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ['.', 'temporal']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - uses: golangci/golangci-lint-action@v6
        with:
          working-directory: ${{ matrix.module }}
          args: --config=${{ github.workspace }}/.golangci.yml
