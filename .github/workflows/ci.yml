name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow dispatches CI for the release PR, which pull_request
  # never sees because GITHUB_TOKEN pushes its commits.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (go ${{ matrix.go }}, ${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ['1.24', '1.25']
        module: ['.', 'temporal']
        exclude:
          # The temporal module's go directive is 1.25.x, so Go 1.24 cannot
          # build it -- and setup-go pins GOTOOLCHAIN=local, which (correctly)
          # forbids silently downloading a newer toolchain to paper over that.
          # The root module still supports 1.24 and is still tested on it.
          - go: '1.24'
            module: temporal
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - name: go vet
        working-directory: ${{ matrix.module }}
        run: go vet ./...
      - name: go test -race
        working-directory: ${{ matrix.module }}
        run: go test -race ./...

  zero-deps:
    name: engine has zero external dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.24'
      - name: assert the root module has zero external dependencies
        run: |
          # The module graph must contain only the module itself: no required
          # modules at all. (net/http transitively lists the standard library's
          # own vendored golang.org/x packages, which are not module deps — so
          # we check at the module level, not the package level.)
          mods=$(go list -m all)
          count=$(printf '%s\n' "$mods" | wc -l)
          if [ "$count" -ne 1 ]; then
            echo "root module has external dependencies:"; printf '%s\n' "$mods"; exit 1
          fi
          echo "ok: engine module graph is self-only ($mods)"

  coverage:
    name: coverage gate (>=85%)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Codecov upload authenticates with OIDC, no stored token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.24'
      - name: test with coverage (library packages only)
        # The behavioural suite lives in engine/ and drives the other packages
        # through it, so coverage is counted across packages.
        run: |
          pkgs=$(go list ./... | grep -vE '/examples/|/cmd/|/docs/|/internal/demos')
          go test -coverprofile=cover.out -coverpkg="$(echo $pkgs | tr ' ' ',')" $pkgs
      - name: enforce threshold
        run: |
          total=$(go tool cover -func=cover.out | awk '/^total:/ {print substr($3, 1, length($3)-1)}')
          echo "total coverage: ${total}%"
          awk "BEGIN { exit !(${total} >= 85) }" || { echo "coverage ${total}% is below the 85% gate"; exit 1; }
      - name: publish to Codecov
        # Reporting only: the gate above decides pass or fail, and a fork PR
        # has no OIDC token to upload with.
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: cover.out
          disable_search: true
          fail_ci_if_error: false

  goreleaser-check:
    name: validate GoReleaser config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.24'
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "~> v2"
          args: check

  lint:
    name: golangci-lint (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ['.', 'temporal']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25'
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.10.1
          working-directory: ${{ matrix.module }}
          args: --config=${{ github.workspace }}/.golangci.yml

  tidy:
    name: go.mod is tidy (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ['.', 'temporal']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25'
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - name: go mod tidy -diff
        working-directory: ${{ matrix.module }}
        run: go mod tidy -diff

  api:
    name: API compatibility
    # The release PR is dispatched, not a pull_request, so it never runs this.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25'
      - name: install apidiff
        run: go install golang.org/x/exp/cmd/apidiff@v0.0.0-20260813180055-c1d0aacb2297
      - name: compare the exported API with the base branch
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          module=github.com/arisros/fate
          git worktree add --quiet "$RUNNER_TEMP/base" "$BASE_SHA"
          (cd "$RUNNER_TEMP/base" && apidiff -m -w "$RUNNER_TEMP/base.export" "$module")
          # apidiff always exits 0, so the report itself is the signal.
          report=$(apidiff -m -incompatible "$RUNNER_TEMP/base.export" "$module" 2>&1 | grep -v '^Ignoring internal package' || true)
          if [ -z "$report" ]; then
            echo "ok: no incompatible API changes"
            exit 0
          fi
          printf '%s\n' "$report"
          if printf '%s' "$PR_TITLE" | grep -qE '^[a-z]+(\([^)]*\))?!:'; then
            echo "allowed: the PR title marks a breaking change"
            exit 0
          fi
          echo "incompatible API changes need a breaking marker in the PR title (feat!: ...); see docs/versioning.md"
          exit 1

  site:
    name: build the documentation site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: '22'
      - name: install
        working-directory: docs
        run: npm install --no-audit --no-fund
      - name: build
        # VitePress fails the build on dead relative links, so this also
        # catches cross-references broken by a doc rename.
        working-directory: docs
        run: npm run build
      - name: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site
          path: docs/.vitepress/dist
          retention-days: 7
