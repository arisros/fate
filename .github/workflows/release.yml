name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: create GitHub release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: verify tests pass at tag
        run: go test ./...

      - name: run GoReleaser (binaries + archives + release notes)
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# The scs-web Docker image is built from the repository Dockerfile
# (`docker build -t fate-scs-web .`). Publishing it to a registry can be wired
# into GoReleaser's `dockers:` section once a registry/credentials are chosen.
