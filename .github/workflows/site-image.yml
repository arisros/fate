name: Site image

# The docs site changes between engine releases, so the image tag carries the
# commit as well as the released version: ghcr.io/arisros/fate-site:0.6.0-2f2efc3.
on:
  push:
    branches: [main]
    paths:
      - docs/**
      - .release-please-manifest.json
      - .github/workflows/site-image.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-image
  cancel-in-progress: false

jobs:
  image:
    name: publish the docs site image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/fate-site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: resolve the tag
        id: tag
        run: |
          version=$(jq -r '."."' .release-please-manifest.json)
          echo "tag=${version}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: build
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          docker build -f docs/Dockerfile \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            -t "${IMAGE}:${TAG}" .

      - name: push
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          GHCR_TOKEN: ${{ github.token }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "${IMAGE}:${TAG}"
          echo "published \`${IMAGE}:${TAG}\`" >> "$GITHUB_STEP_SUMMARY"
