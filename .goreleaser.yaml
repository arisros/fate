# GoReleaser configuration for the fate CLI.
# .github/workflows/release.yml runs it after release-please tags vX.Y.Z and
# creates the GitHub release; it adds cross-platform binaries, archives, and
# checksums to that release and keeps release-please's notes.
version: 2

project_name: fate

before:
  hooks:
    - go mod tidy

builds:
  - id: fate
    main: ./cmd/fate
    binary: fate
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags: ["-s -w"]
    goos: [linux, darwin]
    goarch: [amd64, arm64]

archives:
  - id: default
    ids: [fate]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: "checksums.txt"

changelog:
  disable: true

release:
  prerelease: auto
  mode: keep-existing
